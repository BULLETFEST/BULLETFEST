          #   outputDir: ./build/Linux/
          #   targetName: StandaloneLinux64
          #   editorModule: linux-mono
    steps:
      - run: |
          apt update && apt install sudo
          curl -sL https://deb.nodesource.com/setup_16.x -o /tmp/nodesource_setup.sh
          sudo bash /tmp/nodesource_setup.sh
          sudo apt -y install nodejs
          sudo apt-get install -y gconf-service libasound2 libgbm-dev libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 ca-certificates fonts-liberation libnss3 lsb-release xdg-utils wget ca-certificates

      - id: extract
        uses: EliasVal/actions-docker-extract@specifyPath
        with:
          image: 'unityci/editor:ubuntu-2023.1.8f1-android-1.1.2'
          path: './opt/unity/.'
