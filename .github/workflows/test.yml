        uses: actions/checkout@v3

      - name: Build Android Player
        run: ${{ steps.extract.outputs.destination }}/Editor/Unity -quit -batchmode -nographics -silent-crashes -logFile -projectPath . -buildTarget Win64 -executeMethod BuildScript.PerformBuild -serial ${{ secrets.UNITY_SERIAL }} -password ${{ secrets.UNITY_PASSWORD }} --username ${{ secrets.UNITY_EMAIL }}

