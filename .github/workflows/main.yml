name: UnityBuild

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          #- StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          #- StandaloneWindows # Build a Windows standalone.
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
          - StandaloneLinux64 # Build a Linux 64-bit standalone.
          #- iOS # Build an iOS player.
          #- Android # Build an Android .apk standalone app.
          #- WebGL # WebGL.
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install 7zip
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          lfs: true
      - name: Get Build Version
        run: |
          touch projectVer.txt
          echo $(cat ./ProjectSettings/ProjectSettings.asset | grep bundleVersion | sed -n -e 's/^.*bundleVersion: //p' ) > projectVer.txt

      - uses: actions/upload-artifact@v2
        with:
          name: projectVer
          path: projectVer.txt
      - uses: actions/cache@v2
        with:
          path: Library
          key: Library-BULLETFEST-${{ matrix.targetPlatform }}
          restore-keys: |
            Library-BULLETFEST-
            Library-
      - uses: game-ci/unity-builder@v2
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
          buildName: BULLETFEST_${{ matrix.targetPlatform }}
          versioning: None
      - name: Delete Sensitive files & Create archive
        run: |
          cd ./build/${{ matrix.targetPlatform }}
          sudo rm -rf ./*_BurstDebugInformation_DoNotShip
          7z a -t7z -m0=lzma -mx=9 -mfb=64 -md=32m -ms=on ../../BULLETFEST_${{ matrix.targetPlatform }}.7z *
          cd ../..
      - name: Upload to google drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.DRIVE_CREDENTIALS }}
          filename: 'BULLETFEST_${{ matrix.targetPlatform }}.7z'
          overwrite: true
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}
      - if: ${{ matrix.targetPlatform == 'StandaloneWindows64' }}
        name: Push to dev
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push-branch: dev
          commit-message: 'Updated Version Number'
  NotifyDiscord:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    needs: buildForAllSupportedPlatforms
    steps:
      - uses: actions/download-artifact@v2
        with:
          name: projectVer

      - name: Set Environment Variable
        run: echo "ver=$(cat projectVer.txt)" >> $GITHUB_ENV
      - uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USERNAME: 'BULLETFEST'
          DISCORD_AVATAR: 'https://cdn.discordapp.com/icons/990696460477665311/b7b41f470d1ad5e791cd72dc3bbe58b4.png?size=256'
        with:
          args: |
            ```A new build has been spotted!```

            `v${{ env.ver }}`

            Downloads:
            Linux: <https://drive.google.com/file/d/1rbJa1nVah6mPJ7R5nyyMFGKCw6hGE5jP/view?usp=sharing>
            Windows: <https://drive.google.com/file/d/1XGsgIlPbgAfFbKJdavXmo9kvYYV1-TMS/view?usp=sharing>
