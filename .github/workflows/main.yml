# This is a basic workflow to help you get started with Actions

name: UnityBuild

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          #- StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          #- StandaloneWindows # Build a Windows standalone.
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
          - StandaloneLinux64 # Build a Linux 64-bit standalone.
          #- iOS # Build an iOS player.
          #- Android # Build an Android .apk standalone app.
          #- WebGL # WebGL.
    outputs:
      buildTarget: ${{ steps.echoBuildIndex.outputs.target }}
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/cache@v2
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-
      - uses: game-ci/unity-builder@v2
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
      #- run: 'echo $(ls -a ./build/${{ matrix.targetPlatform }})'
      - run: 'rm -rf $(./build/${{ matrix.targetPlatform }}/BULLETFEST_BurstDebugInformation_DoNotShip)'

      - id: echoBuildIndex
        run: echo "::set-output name=target::${{ matrix.targetPlatform }}"
      #- uses: actions/upload-artifact@v2
      #  with:
      #    name: Build-${{ matrix.targetPlatform }}
      #    path: build/${{ matrix.targetPlatform }}
  CompressAndUpload:
    needs: buildForAllSupportedPlatforms
    steps:
      - name: Compress Build
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: 'BULLETFEST_${{ matrix.targetPlatform }}.zip'
          path: 'build/${{ matrix.targetPlatform }}'
      - name: Upload to google drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.DRIVE_CREDENTIALS }}
          filename: 'BULLETFEST_${{ matrix.targetPlatform }}.zip'
          overwrite: true
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}
