name: UnityBuild

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          #- StandaloneWindows # Build a Windows standalone.
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
          - StandaloneLinux64 # Build a Linux 64-bit standalone.
          #- iOS # Build an iOS player.
          - Android # Build an Android .apk standalone app.
          #- WebGL # WebGL.
    steps:
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install p7zip-full p7zip-rar
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: false

      # Download Cache
      - uses: actions/cache@v3
        with:
          path: |
            Library
            .utmp
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: |
            Library-

      - if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          docker-images: false
      - uses: game-ci/unity-builder@v2
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          allowDirtyBuild: true
          buildName: BULLETFEST #_${{ matrix.targetPlatform }}
          #buildsPath: build_${{ matrix.targetPlatform }}
          versioning: None
          #customParameters: -CompressWithLz4HC

      # Save to cache incase something fails later down the road
      - name: Cache Library
        id: cache-primes-save
        uses: actions/cache/save@v3
        with:
          path: |
            Library
            .utmp
          key: Library-${{ matrix.targetPlatform }}

      - name: Get Build Version
        run: |
          touch projectVer.txt
          echo $(cat ./ProjectSettings/ProjectSettings.asset | grep bundleVersion | sed -n -e 's/^.*bundleVersion: //p' ) > projectVer.txt
      - uses: actions/upload-artifact@v3
        with:
          name: projectVer
          path: projectVer.txt

      - if: matrix.targetPlatform != 'Android'
        name: Create archive
        run: |
          cd ./build/${{ matrix.targetPlatform }}
          7z a -t7z -m0=lzma -mx=9 -mfb=64 -md=32m -ms=on -x'!BULLETFEST_B*' ../../BULLETFEST_${{ matrix.targetPlatform }}.7z *
          cd ../..
      - if: matrix.targetPlatform != 'Android'
        name: Upload Standalone to Google Drive
        uses: mathisve/gdrive-upload-action@main
        with:
          credentials: ${{ secrets.DRIVE_CREDENTIALS }}
          filename: 'BULLETFEST_${{ matrix.targetPlatform }}.7z'
          overwrite: true
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}

      - if: matrix.targetPlatform == 'Android'
        name: Upload APK to Google Drive
        uses: mathisve/gdrive-upload-action@main
        with:
          credentials: ${{ secrets.DRIVE_CREDENTIALS }}
          filename: './build/Android/BULLETFEST.apk'
          overwrite: true
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}

  NotifyDiscord:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    needs: buildForAllSupportedPlatforms
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: projectVer

      - name: Set Environment Variables
        run: |
          echo "ver=$(cat projectVer.txt)" >> $GITHUB_ENV
        #  echo "patchnotes=$(cat patchnotes.txt)" >> $GITHUB_ENV

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.ver }}
          release_name: BULLETFEST v${{ env.ver }}
          draft: false
          prerelease: false
      - uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USERNAME: 'BULLETFEST'
          DISCORD_AVATAR: 'https://cdn.discordapp.com/icons/990696460477665311/b7b41f470d1ad5e791cd72dc3bbe58b4.png?size=256'
        with:
          args: |
            ```A new build has been spotted!```

            `v${{ env.ver }}`

            Downloads:
            Windows: <https://drive.google.com/file/d/1XGsgIlPbgAfFbKJdavXmo9kvYYV1-TMS/view?usp=sharing>
            Linux: <https://drive.google.com/file/d/1rbJa1nVah6mPJ7R5nyyMFGKCw6hGE5jP/view?usp=sharing>
            MacOS (Intel 64 + Apple Silicon): <https://drive.google.com/file/d/1s8wX7TrDSbG93sG5IjDeVvACR_rwN3ET/view?usp=sharing>
            Android: <https://drive.google.com/file/d/1lp_WfbTHPEo4YUJvXchj0ghZbVPNIWNl/view?usp=sharing>
